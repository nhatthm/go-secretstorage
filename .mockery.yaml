dir: mock
structname: '{{.InterfaceName}}'
pkgname: mock
filename: "{{ .InterfaceName | snakecase }}.go"
template: "https://raw.githubusercontent.com/nhatthm/mockery-template/0.5.1/templates/testify-mocker.templ"
template-data:
  unroll-variadic: true
packages:
  github.com/zalando/go-keyring:
    config:
      all: true
  go.nhat.io/secretstorage:
    config:
      exclude-interface-regex: configurableKeyringStorage|Option|.+(Func|Option)
      include-interface-regex: .+
